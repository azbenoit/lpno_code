# One-cycle LR variant of config_flow3D_GAOT, for the straight-path scheduler
# arm. Same relationship to config_flow3D_GAOT as config_flow3D_RIGNO_onecycle
# has to config_flow3D_RIGNO: identical recipe except the LR schedule.
#
# It inherits config_flow3D_RIGNO_onecycle rather than config_flow3D_GAOT, and
# that is deliberate. config_flow3D_GAOT inherits config M, and config M carries
# an INLINE `scheduler:` block whose decay keys survive a `scheduler=one_cycle`
# group swap and then fail with "Key 'decay_rate' not in 'OneCycleLRConf'"
# (recorded in config_flow3D_RIGNO_onecycle's own header). Inheriting the RIGNO
# one-cycle config instead gives the clean one-cycle scheduler block, with every
# non-scheduler hyperparameter still config M's, so this file only has to swap
# the architecture.
#
# Why this arm exists: on this dataset, one-cycle cut RIGNO's validation
# T MAE ~28% (12.6 K -> 9.1 K), so a GAOT-vs-RIGNO comparison where only RIGNO
# gets its best schedule would understate GAOT. Pair this against
# config_flow3D_RIGNO_onecycle, and the plain config_flow3D_GAOT against an
# exponential-schedule RIGNO control.
#
# NOTE `scheduler.total_steps` is no longer read from this file:
# _sync_one_cycle_total_steps (config_loading.py) derives it as max_steps + 200
# on every run, so the cosine always finishes inside the run. Any total_steps
# written here is overridden and logged. Historical caveat: runs made BEFORE
# that sync landed inherited 32200 and stopped ~60% down the cycle at a higher
# LR than the exponential schedule would have reached -- do not compare a
# pre-sync one-cycle run against a post-sync one as if the schedule matched.
defaults:
  - config_flow3D_RIGNO_onecycle
  - _self_

arch:
  gaot:
    # Physical ceiling on T, with a straight-through estimator.
    #
    # NOT just a metric guard -- a TRAINING STABILITY guard. A 32k-step GAOT control
    # trained cleanly to step 12000 (val T MAE 22.4 K), spiked at 14000,
    # and from step 16000 diverged monotonically: 1.4e6 K -> 3.8e8 K by step 28000, with
    # alpha collapsing to a constant (val alpha MAE pinned at 0.74988, exactly the metal
    # fraction). Nothing bounded T, so once the high-LR part of the one-cycle destabilised
    # it there was no restoring force. The 20k runs finish before this window and so never
    # showed it -- which is why the bound was first scoped only to the material configs.
    #
    # 1.3 is physics: Ti-6Al-4V boils at 3123 K and ref_scales.T = 3000, so 1.3 -> 3900 K
    # sits comfortably above anything physical while the true field never exceeds 1.041.
    # Straight-through so a drifted cell still receives corrective gradient, and so one
    # wild cell cannot dominate the batch gradient.
    output_bounds:
      T: [0.0, 1.3]
    # Identical to config_flow3D_GAOT's arch block; see that file for the
    # reasoning behind each value (latent lattice sized against the 61x40x40
    # cropped grid, source-centric encoder for full input coverage, geometry
    # embedding off, fp32).
    dimension: 3
    latent_tokens: [32, 20, 20]
    patch_size: 2
    lifting_channels: 32
    hidden_size: 256
    ffn_hidden_size: 1024
    num_layers: 5
    num_heads: 8
    num_kv_heads: 8
    atten_dropout: 0.0
    positional_embedding: absolute
    use_long_range_skip: true
    mlp_hidden_layers: [64, 64, 64]
    projection_channels: 256
    neighbor_strategy: knn
    k_encoder: 4
    k_decoder: 8
    gno_radius: 0.15
    max_neighbors: 0
    use_attention: true
    attention_type: cosine
    transform_type: linear
    use_geoembed_encoder: false
    use_geoembed_decoder: false
    decoder_stencil: knn
    decoder_kernel: agno
    neighbor_metric: null
    use_pointwise_skip: false
    pointwise_skip_channels: 64
    embedding_method: statistical
    cache_dir: outputs/gaot_graphs

custom:
  name: gaot_sp_onecycle
  model_family: gaot
