# GAOT on the variable-length random-path set.
#
# Inherits config_flow3D_RIGNO_randompath -- the validated recipe for THIS data,
# which differs from the straight-path config M in ways that are about the data,
# not the architecture: per-frame `time_as_batch=true` in the lab frame
# (`moving_ref_frame=false`), the manifest-derived laser-trajectory input
# channels (beam_x/beam_y/beam_dist/path_dose/path_dose_recent), and the `sum`
# loss aggregator. Overriding only `custom.model_family` and the arch block keeps
# this an architecture measurement against RIGNO's own numbers on this set.
#
# `amp.enabled: false` is a deliberate override of the parent. The parent turns
# fp16 autocast ON, but GAOT normalises its attentional graph operator with a
# segment softmax over neighbourhoods (an exp/sum reduction over up to ~1.2M
# edges) which is a textbook fp16 overflow site, and the straight-path GAOT
# results were all measured in fp32. Establish the fp32 number first; amp is a
# separate, later experiment.
#
# Runs at FULL RESOLUTION -- do NOT set `PINO_LAZY_STRIDE`. The dataset stores a
# 150x100x40 grid; RIGNO cannot fit that on a 24 GB card (its region graph is
# subsampled from the input cloud, so its r2p set hits ~3.6M edges) which is why
# its recorded baseline trained at stride 2,2,1. GAOT has no such limit: its latent
# lattice is fixed by config, so only the encoder/decoder edge sets scale with
# input size. Measured forward+backward, batch 1:
#     75x50x40  (strided)     150k nodes,  0.6M/1.2M edges ->  3,992 MiB
#     150x100x40 (full)       600k nodes,  2.4M/4.8M edges -> 14,877 MiB
#     full, 34k latent tokens                              -> 15,112 MiB
# i.e. full resolution fits in 14.9 GiB of 24 GB, and quadrupling the LATENT
# lattice costs only 235 MiB more, because the lattice -- not the input -- sets the
# transformer cost.
#
# Striding is therefore deprecated for GAOT: it saves no loader time at all
# (PINO_LAZY_STRIDE decimates AFTER decompression, npz_lazy_store.py:233 vs :236),
# saves memory GAOT does not need, and discards 3/4 of every field to accommodate a
# different architecture's constraint. Run strided ONLY for a like-for-like
# comparison against RIGNO's random-path baseline, which exists only at stride.
#
# Inherits the ONE-CYCLE random-path config, matching the RIGNO random-path
# baseline, so the scheduler is not a confound.
#
# Run this with `PINO_LOADER_WORKERS=4` in the env, as the RIGNO random-path runs do.
# Without it the loader blocks synchronously on a whole-case read every step and
# throughput collapses: measured 8.7-9.3 s/iteration with GPU utilisation at 0%,
# against ~2.6 s/iteration for RIGNO on the same data with 4 workers. The lazy
# store caches an entire case (all frames, because cumulative path_dose needs the
# full trajectory), so with globally shuffled per-frame sampling over ~195 cases
# almost every step is a cache miss; the workers are what hide that latency.
#
# Reference: the RIGNO random-path control (config_flow3D_RIGNO_randompath_onecycle).
defaults:
  - config_flow3D_RIGNO_randompath_onecycle
  - _self_

amp:
  enabled: false

arch:
  gaot:
    # Physical ceiling on T, with a straight-through estimator.
    #
    # NOT just a metric guard -- a TRAINING STABILITY guard. A 32k-step GAOT control
    # trained cleanly to step 12000 (val T MAE 22.4 K), spiked at 14000,
    # and from step 16000 diverged monotonically: 1.4e6 K -> 3.8e8 K by step 28000, with
    # alpha collapsing to a constant (val alpha MAE pinned at 0.74988, exactly the metal
    # fraction). Nothing bounded T, so once the high-LR part of the one-cycle destabilised
    # it there was no restoring force. The 20k runs finish before this window and so never
    # showed it -- which is why the bound was first scoped only to the material configs.
    #
    # 1.3 is physics: Ti-6Al-4V boils at 3123 K and ref_scales.T = 3000, so 1.3 -> 3900 K
    # sits comfortably above anything physical while the true field never exceeds 1.041.
    # Straight-through so a drifted cell still receives corrective gradient, and so one
    # wild cell cannot dominate the batch gradient.
    output_bounds:
      T: [0.0, 1.3]
    # Same architecture as config_flow3D_GAOT apart from the latent lattice,
    # which tracks this dataset's strided grid instead of the straight-path crop.
    dimension: 3
    # Sized for the FULL 150 x 100 x 40 grid: 50 x 34 x 20 is about a third per
    # axis, 34,000 tokens, 4,250 patches at patch_size 2. Measured at only 235 MiB
    # more than a 19,760-token lattice on the same grid, because the transformer
    # cost is set by the lattice and the edge sets by the input. The straight-path
    # ablation showed latent resolution is not a sensitive accuracy knob (2.1x the
    # tokens was a wash), so this is sized for proportionality, not tuned.
    latent_tokens: [50, 34, 20]
    patch_size: 2
    lifting_channels: 32
    hidden_size: 256
    ffn_hidden_size: 1024
    num_layers: 5
    num_heads: 8
    num_kv_heads: 8
    atten_dropout: 0.0
    positional_embedding: absolute
    use_long_range_skip: true
    mlp_hidden_layers: [64, 64, 64]
    projection_channels: 256
    neighbor_strategy: knn
    k_encoder: 4
    k_decoder: 8
    gno_radius: 0.15
    max_neighbors: 0
    use_attention: true
    attention_type: cosine
    transform_type: linear
    # Off, per the straight-path ablation: no measurable benefit on a structured
    # grid, 1.5 GiB saved, and it removes the eigvalsh silent-failure mode.
    use_geoembed_encoder: false
    use_geoembed_decoder: false
    decoder_stencil: knn       # trilinear: see config_flow3D_GAOT.yaml
    decoder_kernel: agno       # see config_flow3D_GAOT.yaml
    neighbor_metric: null      # see config_flow3D_GAOT.yaml
    use_pointwise_skip: false
    pointwise_skip_channels: 64
    embedding_method: statistical
    cache_dir: outputs/gaot_graphs

custom:
  name: gaot_rp
  model_family: gaot
