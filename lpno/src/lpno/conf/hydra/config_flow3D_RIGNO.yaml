defaults:
  - physicsnemo_default
  - scheduler: one_cycle
  - optimizer: lion
  - loss: relobralo_tuned
  - _self_
run_mode: train

save_filetypes : "vtk,npz"
cuda_graphs: false
arch:
  rigno:
    # Region Interaction Graph Neural Operator (in-repo Arch, see models/rigno_arch.py).
    # dimension is overwritten by config_loading from use_2D (2 or 3).
    # Defaults are the tuned straight-path recipe (config M).
    dimension: 3
    node_latent_size: 96
    edge_latent_size: 96
    # Depth 18 + 8 graph variants: the `d18_g8` recipe. Models trained at the
    # former depth-8 default need `processor_steps=8` and `num_graph_variants=1`
    # pinned at evaluation, or their checkpoints will not load.
    processor_steps: 18
    # Declared here so hydra struct mode accepts an override; every RIGNO config
    # reaches this knob in rigno_arch, and `randompath`/`onecycle` set it to 1.
    # Recompute encoder/processor/decoder in backward to cut activation
    # memory (~one extra forward). Off by default; the knob exists in
    # rigno_arch for every RIGNO config, so declare it here too or hydra
    # struct mode rejects the override.
    # REQUIRED with processor_steps=18 + num_graph_variants=8: the depth-8
    # baseline already sits at ~23.3 GiB of a 23.46 GiB card, so either
    # addition alone tips it over. The d18_g8 recipe runs with it True.
    # Costs ~one extra forward.
    grad_checkpointing: true
    mlp_hidden_layers: 1
    subsample_factor: 8.0
    rmesh_levels: 4
    k_p2r: 4
    k_r2p: 6
    p_edge_masking: 0.10
    # Upstream-parity knobs, all no-ops at these defaults so config M's
    # validated recipe is unchanged. Declared here (not only in the randompath
    # configs) because hydra struct mode refuses to override an undeclared key,
    # which otherwise breaks every config that sets them.
    num_graph_variants: 8  # d18_g8 recipe
    inference_edge_masking: 0.0
    rnode_count: 0
    # FiLM the broadcast-constant scalars: they carry no spatial information, so
    # entering them as uniform pnode channels wastes capacity. A parity ablation
    # measured FiLM at ~-28% T MAE on the straight path.
    # ONLY these three: rigno_arch asserts `film_keys not in input keys`, and P /
    # V_scan / H_norm are the only inputs every RIGNO config declares. Sweep-specific
    # scalars (preheat_T0, focus_factor, beam_shape_uniform) stay in the config that
    # declares them. Covered by tests/test_rigno_base_film_keys.py.
    film_keys: [P, V_scan, H_norm]
    graph_seed: 0
    cache_dir: outputs/rigno_graphs

# loss params live in loss/relobralo_tuned.yaml: an inline block
# here survives `override /loss: <other>` and fails struct validation on the
# other aggregator's schema, which made the aggregator unswappable. Composed
# values are unchanged (alpha 0.95, beta 0.99, tau 3.0) -- pinned by
# tests/test_homosc_config.py.

scheduler:
  # One-cycle. Measured on the straight-path set, same 20k steps
  # and same splits: tf_exponential_lr 0.98/250 gave val T MAE 12.65 K, a completed
  # one-cycle gave 9.11 K -- 28% better for RIGNO, and 31% better for GAOT. The
  # exponential schedule was not learning less; it was still oscillating +-2.5 K
  # between validations when the run ended, so the kept checkpoint was wherever the
  # oscillation happened to be. One-cycle anneals to ~max_lr/100 and the spread
  # collapses to ~0.3 K, pinning the final checkpoint on the run's best.
  #
  # total_steps is NOT set here on purpose: config_loading._sync_one_cycle_total_steps
  # derives it from training.max_steps on every run. A hand-set value silently
  # breaks the schedule whenever max_steps differs (a 32200-step cosine truncated
  # at 20k stops ~60% down, at a LR *higher* than the exponential reaches, which is
  # worse than not using one-cycle at all).
  max_lr: 3e-4
  pct_start: 0.05
  div_factor: 10.0
  final_div_factor: 10.0

optimizer:
  lr: 3e-4

training:
  rec_results_freq: 100
  print_stats_freq: 100
  summary_freq: 100
  max_steps: 32000

batch_size:
  grid: 1
  validation: 1

custom:
  name: unnamed
  model_family: rigno
  data_dir: "DEFAULT"
  val_data_dir: "DEFAULT"
  param_dir: "DEFAULT"
  split_mode: standard
  k_folds: 8
  fold_index: -1
  # H1-seminorm data loss (custom_utils/losses.py GridGradientLoss): pointwise
  # L2 plus gradient-mismatch at this relative weight. 0 = plain PointwiseLossNorm.
  gradient_loss_weight: 0.0
  # Spatial edge-downweight beta for GridGradientLoss: w = 1/(1+beta*|gradT|/mean).
  # 0 = uniform (off). Forces GridGradientLoss on.
  edge_downweight: 0.0
  # Melt-focus terms (both force GridGradientLoss on, both gated by the warmup).
  # melt_dice_weight: soft-Dice on the melt pool (from T) and the recoil cavity
  # (from alpha), in units of the summed pointwise loss. melt_weight: upweights
  # voxels inside the ground-truth melt by 1 + melt_weight * fl_true.
  melt_dice_weight: 0.0
  melt_weight: 0.0
  melt_tau: 0.05
  # The term stays exactly 0 below warmup, then ramps linearly to full, so it
  # only engages once a rough melt pool already exists.
  melt_loss_warmup_steps: 0
  melt_loss_ramp_steps: 0
  # In-training validation on a seeded subset of N val cases (0 = full split).
  # The 9-case straight val split is cheap, so this config keeps the full pass.
  val_max_cases: 0
  pde_loss: false
  VOF_pde_loss: false
  Diff_loss: false
  Diff_weight: 1e14
  pde_weight: 1.0e-1
  super_res: 1
  detect_anomaly: false
  sharp_alpha: false
  alpha_masking: true
  # Restrict the headline metric REPORT to the substrate, excluding the free gas
  # gap above the material (~25% of a FLOW-3D domain, filled with the same
  # constant in prediction and truth so it dilutes every mean by ~1/0.75).
  # Declared here because the AiiDA adapters emit it as a `custom.` override and
  # Hydra runs in struct mode: an undeclared key is a hard failure at startup.
  metrics_exclude_gas: false
  # Step at which hard alpha-masking switches on (cold starts only).
  # null = shipped default (500). Set it PAST the LR warmup: masking a
  # model that has not begun to learn alpha zeroes its gradients.
  mask_warmup_steps: null
  include_time: true
  time_avg_window: 30
  moving_frame_steps: 30
  moving_ref_frame: true
  wandb_offline: false
  inference_batch_size: 1
  use_2D: false
  time_as_dim: false
  time_as_batch: false
  infer_velocities: false
  fast_training: false
  autoregressive:
    enabled: false
    mode: masked_patch
    state_prev_suffix: "_prev"
    patch_size: [32, 16, 16]
    context_steps: 1
    mask_mode: block
    mask_ratio: 0.15
    train_patches_per_epoch: 256
    val_patches_per_epoch: 64
    eval_horizon_k: 10
    eval_use_gt_init: true
    require_time: true
    prev_noise_std: 0.0
    prev_noise_resample: false
    clamp_feedback: false
    clamp_t_min: null
    clamp_t_max: null
    unroll_steps: 1
    unroll_detach_grad: false
  cuda_device: 0
  cuda_visible_devices: null
  cuda_local_device: 0

  software: flow3D
  geometry:
    x_range: [-4.5e-4, 4.5e-4]
    y_range: [-2e-4, 2e-4]
    z_range: [-3e-4, 0]
    resolution: [90, 40, 30]

  ref_scales:
    L: 1e-4
    T: 3000
    V: 0.1
    P: 10
    Rho: 4.506e3
    H: 203

  laser:
    type: given
    x0: 0.0
    z0: -5e-6

  material_params:
    rho: 4.506e3
    c:
      coeffs: [0.1341, 531]
    K:
      coeffs: [0.0151, 1.433]
    V_scan: null
    L: 3.45e5
    Kl: null
    Ks: null
    cl: null
    cs: null
    rho_l: null
    rho_s: null
    T_s: 1873
    T_l: 1923
    weight: null
    c_g: 520
    K_g: 0.018
    T_l_g: 10
    T_s_g: 1
    rho_g: 1.7
    L_g: 1

  vtk_fields:
    - Temperature
    - Solid Fraction
    - Pressure
    - Fraction Of Fluid
    - Velocity
    # NOTE: no X-/Y-/Z-velocity here. The FLOW-3D NPZ exporter writes only the
    # Velocity vector and drops the per-component arrays as redundant
    # (flow3D_scripts/README.md, NPZ layout). Naming them was a latent KeyError
    # that fired as soon as time_as_batch=true routed through the lazy store.

  FNO_input_keys:
    - V_scan
    - P
    - H_norm
    - x
    - y
    - z

  FNO_output_keys:
    - T
    - alpha

  Energy_input_keys:
    - u
    - v
    - w
    - Deposition

  Energy_output_keys:
    - energy

  VOF_input_keys:
    - u
    - v
    - w

  VOF_output_keys:
    - VOF

  Diff_input_keys: []

  Diff_output_keys:
    - T_diffTerm

summary_histograms: "log2"
hydra:
  run:
    dir: outputs/${custom.name}_${now:%m%d_%H%M}
