defaults:
  - physicsnemo_default
  - /arch/conv_fully_connected_cfg@arch.decoder
  - /arch/fno_cfg@arch.fno
  - scheduler: tf_exponential_lr
  - optimizer: lion
  - loss: relobralo
  - _self_
run_mode: train

save_filetypes : "vtk,npz"
cuda_graphs: false
arch:
  decoder:
    input_keys: [z, 32]
    output_keys: T
    nr_layers: 3
    layer_size: 32

  fno:
    input_keys: x, y, z, V_scan, P
    dimension: 3
    nr_fno_layers: 3
    fno_modes: [25,20,15]
    padding: 9

loss:
  alpha: 0.95
  beta: 0.99
  tau: 3.0

scheduler:
  decay_rate: 0.98
  decay_steps: 100

optimizer:
  lr: 6e-5

training:
  rec_results_freq: 100
  print_stats_freq: 100
  summary_freq: 100
  max_steps: 15000

batch_size:
  grid: 20
  validation: 20

custom:
  name: unnamed
  data_dir: "DEFAULT"
  val_data_dir: "DEFAULT"
  param_dir: "DEFAULT"
  split_mode: standard
  k_folds: 8
  fold_index: -1
  pde_loss: false
  VOF_pde_loss: false
  Diff_loss: false
  Diff_weight: 1e14
  pde_weight: 1.0e-1
  super_res: 1
  detect_anomaly: false
  sharp_alpha: false
  alpha_masking: false
  # Restrict the headline metric REPORT to the substrate, excluding the free gas
  # gap above the material (~25% of a FLOW-3D domain, filled with the same
  # constant in prediction and truth so it dilutes every mean by ~1/0.75).
  # Declared here because the AiiDA adapters emit it as a `custom.` override and
  # Hydra runs in struct mode: an undeclared key is a hard failure at startup.
  metrics_exclude_gas: false
  # Step at which hard alpha-masking switches on (cold starts only).
  # null = shipped default (500). Set it PAST the LR warmup: masking a
  # model that has not begun to learn alpha zeroes its gradients.
  mask_warmup_steps: null
  include_time: false
  time_avg_window: 30
  moving_frame_steps: 30
  moving_ref_frame: true
  wandb_offline: false
  inference_batch_size: 2
  use_2D: false
  time_as_dim: false
  time_as_batch: false
  infer_velocities: false
  fast_training: false
  autoregressive:
    enabled: false
    mode: masked_patch
    state_prev_suffix: "_prev"
    patch_size: [32, 16, 16]
    context_steps: 1
    mask_mode: block
    mask_ratio: 0.15
    train_patches_per_epoch: 256
    val_patches_per_epoch: 64
    eval_horizon_k: 10
    eval_use_gt_init: true
    require_time: true
    prev_noise_std: 0.0
    prev_noise_resample: false
    clamp_feedback: false
    clamp_t_min: null
    clamp_t_max: null
    unroll_steps: 1
    unroll_detach_grad: false
  cuda_device: 0
  cuda_visible_devices: null
  cuda_local_device: 0

  software: abaqus
  geometry:
    x_range: [0.0, 0.3]
    y_range: [-0.2, 0.2]
    z_range: [0.0, 0.24]
    resolution: [30, 40, 24]

  ref_scales:
    L: 0.1
    T: 3000
    V: 10
    P: 10000
    C: 8.455e8
    Rho: 4.4e-9
    rho: 4.4e-9
    K: 40

  laser:
    type: gaussian
    eta: 0.15
    P: null
    sig: 0.025
    O_PD: 0.027
    x0: 0.127
    y0: 0.0
    z0: 0.24

  material_params:
    rho:
      coeffs: [-4.86737553e-17, -3.58007123e-14, 4.43645349e-09]
    K:
      coeffs: [1.53621711e-06, 1.00388663e-02, 3.99308963e+00]
    c: c
    weight: null

  vtk_fields: []

  FNO_input_keys:
    - V_scan
    - P
    - x
    - y
    - z

  FNO_output_keys:
    - T

  Energy_input_keys: []
  Energy_output_keys: []
  VOF_input_keys: []
  VOF_output_keys: []
  Diff_input_keys: []
  Diff_output_keys: []

summary_histograms: "log2"
hydra:
  run:
    dir: outputs/${custom.name}_${now:%m%d_%H%M}
