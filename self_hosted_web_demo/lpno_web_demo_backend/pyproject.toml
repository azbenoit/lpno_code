[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lpno-web-demo-backend"
version = "0.1.0"
description = "FastAPI inference backend of the self-hosted LP-NO web demo"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [
  { name = "Alix Benoit", email = "alix.benoit@alumni.polytechnique.org" },
  { name = "Elia Iseli" },
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.24",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.11",
  "matplotlib>=3.7",
  "plotly>=6.0",
  "pyvista>=0.46",
  "vtk>=9.3",
  "PyYAML>=6.0",
  "omegaconf>=2.3",
  "hydra-core>=1.3",
  "wandb",
  "scikit-learn",
  # Pinned: torch_scatter (installed from the PyG wheel index by scripts/setup_env.sh)
  # is built against one exact torch, and physicsnemo-sym's sdist build imports torch,
  # so both must be installed after it and without build isolation -- see the script.
  "torch==2.8.*",
  "nvidia-physicsnemo==1.2.0",
  "nvidia-physicsnemo-sym==2.2.0",
]

[project.urls]
Repository = "https://github.com/azbenoit/lpno_code"

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
